name: nano-banana-mcp
region: sfo

services:
  - name: web
    github:
      repo: bcharleson/nano-banana-mcp
      branch: main
      deploy_on_push: true
    
    dockerfile_path: Dockerfile
    
    http_port: 8000
    
    instance_count: 1
    instance_size_slug: basic-xxs
    
    envs:
      - key: PORT
        value: "8000"
      - key: GEMINI_API_KEY
        scope: RUN_TIME
        type: SECRET
    
    health_check:
      http_path: /health
      initial_delay_seconds: 30
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    
    routes:
      - path: /
